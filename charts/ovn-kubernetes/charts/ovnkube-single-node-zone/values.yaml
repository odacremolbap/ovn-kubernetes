# Default values for ovnkube-single-node-zone.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

ovnkubeSingleNodeZone:
  logging:
    level: "5"
  # -- resource requests and limits for the ovnkube-controller container
  resources:
    requests:
      cpu: 200m
      memory: 500Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  # -- startup probe for the ovnkube-controller container. It runs the liveness check
  # (CNI config present, CNI server socket answering) and holds off the liveness and
  # readiness probes until it passes, so a start that is slow because the API servers
  # are overloaded is not killed. The start-up budget is periodSeconds x
  # failureThreshold, 30 minutes by default. Set to null to drop the probe.
  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 180

ovnkubeSingleNodeZoneNbdb:
  logging:
    level: "-vconsole:info -vfile:info"
  # -- resource requests and limits for the nb-ovsdb container
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 256Mi

ovnkubeSingleNodeZoneSbdb:
  logging:
    level: "-vconsole:info -vfile:info"
  # -- resource requests and limits for the sb-ovsdb container
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ovnkubeSingleNodeZoneNorthd:
  logging:
    level: "-vconsole:info -vfile:info"
  # -- resource requests and limits for the ovn-northd container
  resources:
    requests:
      cpu: 20m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 512Mi

ovnkubeSingleNodeZoneOvnHost:
  logging:
    level: "-vconsole:info"
  # -- resource requests and limits for the ovn-controller container
  resources:
    requests:
      cpu: 60m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: k8s.ovn.org/dpu-host
          operator: DoesNotExist

# -- extra annotations for the ovnkube-node pod template.
podAnnotations: {}

# -- update strategy for the ovnkube-node DaemonSet. On a large cluster a new pod
# can take minutes to start, because it downloads cluster-wide state from the API
# servers, so keep maxUnavailable small: 5% of 5000 nodes is 250 pods starting at
# once. maxUnavailable must be a percentage string; Kubernetes rounds it up, so it
# is never 0. Set type to OnDelete to replace pods only as they are deleted.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 5%

# To utilize hardware offloading for management ports, a netdevice or a deviceplugin resource name that
# specifies a pool of devices can be specified.
# mgmtPortVFResourceName will override nodeMgmtPortNetdev if both are specified

# The net device to be used for management ports
nodeMgmtPortNetdev: ""

# The device plugin resource name that identifies the allocated interfaces to be used for management ports
# This field must be set when using hardware offloading for primary UDNs.
mgmtPortVFResourceName: ""
# If using hardware offloading for primary UDNs,the number of VFs required to handle management ports,
# which depends on the number of primary UDNs required must also be specified.
# -- set the count of VFs required to handle management ports for UDN
mgmtPortVFsCount: 4

# -- prometheus monitoring related fields
monitoring:
  # -- specify the labels for serviceMonitors to be selected for target discovery.
  # Prometheus operator defines what namespaces and what servicemonitors within these
  # namespaces must be selected for target discovery. The fields defined below helps
  # in defining that.
  serviceMonitorSelectorLabels:
    k8s-app: ovnkube-node
    release: kube-prometheus-stack


# -- tolerations for the ovnkube-node pods.
tolerations:
- operator: "Exists"
